name: Build MU Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-mu-mobile.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4

      - name: Download MU mobile source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/yes999zc/muonline-client.git muclient

      - name: Configure OpenMU server
        shell: pwsh
        working-directory: muclient
        run: |
          $path = "Client.Main/appsettings.json"
          $cfg = Get-Content $path -Raw | ConvertFrom-Json
          $cfg.MuOnlineSettings.ConnectServerHost = "167.114.179.236"
          $cfg.MuOnlineSettings.ConnectServerPort = 44405
          $cfg.MuOnlineSettings.ProtocolVersion = "Season6"
          $cfg.MuOnlineSettings.ClientVersion = "2.04d"
          $cfg.MuOnlineSettings.ClientSerial = "k1Pk2jcET48mxL3b"
          $cfg.MuOnlineSettings.Graphics.IsFullScreen = $true
          $cfg | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding UTF8

      - name: Optimize Android startup and persistent data
        shell: pwsh
        working-directory: muclient
        run: |
          $proj = "MuAndroid/MuAndroid.csproj"
          $text = Get-Content $proj -Raw
          $text = $text -replace "<ApplicationId>.*?</ApplicationId>", "<ApplicationId>com.openmu.mumobile</ApplicationId>"
          $text = $text -replace "<ApplicationVersion>.*?</ApplicationVersion>", "<ApplicationVersion>2</ApplicationVersion>"
          $text = $text -replace "<ApplicationDisplayVersion>.*?</ApplicationDisplayVersion>", "<ApplicationDisplayVersion>1.1</ApplicationDisplayVersion>"
          Set-Content $proj $text -Encoding UTF8

          $strings = Get-ChildItem "MuAndroid" -Recurse -Filter "Strings.xml" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($strings) {
            $s = Get-Content $strings.FullName -Raw
            $s = $s -replace '(?s)<string name="app_name">.*?</string>', '<string name="app_name">MU Online Mobile</string>'
            Set-Content $strings.FullName $s -Encoding UTF8
          }

          $mainPath = "MuAndroid/MainActivity.cs"
          $mainText = Get-Content $mainPath -Raw
          $needle = 'Constants.SETTINGS_PATH = EnsureAndroidConfig();'
          if (-not $mainText.Contains($needle)) { throw "Nao encontrei ponto para configurar DataPath." }
          $replacement = "Constants.SETTINGS_PATH = EnsureAndroidConfig();`r`n            Constants.DataPath = Path.Combine(Application.Context.FilesDir!.AbsolutePath, `"Data`");"
          $mainText = $mainText.Replace($needle, $replacement)
          Set-Content $mainPath $mainText -Encoding UTF8

          $loadPath = "Client.Main/Scenes/LoadScene.cs"
          $loadText = Get-Content $loadPath -Raw

          $pattern = 'if \(OperatingSystem\.IsAndroid\(\)\)\s*nextSceneType = typeof\(ServerConfigScene\);\s*else\s*nextSceneType = Constants\.ENTRY_SCENE == typeof\(LoadScene\)\s*\? typeof\(LoginScene\)\s*:\s*Constants\.ENTRY_SCENE;'
          $replacementScene = 'nextSceneType = Constants.ENTRY_SCENE == typeof(LoadScene) ? typeof(LoginScene) : Constants.ENTRY_SCENE;'
          $loadText = [regex]::Replace($loadText, $pattern, $replacementScene)

          $extractNeedle = 'await ExtractZipWithProgressAsync(localZip, extractPath, ct);'
          $extractReplacement = "await ExtractZipWithProgressAsync(localZip, extractPath, ct);`r`n            File.WriteAllText(Path.Combine(extractPath, `".data-ready-v1`"), `"ok`");"
          if (-not $loadText.Contains($extractNeedle)) { throw "Nao encontrei etapa de extracao." }
          $loadText = $loadText.Replace($extractNeedle, $extractReplacement)

          $checkPattern = 'return Directory\.EnumerateFileSystemEntries\(dataPath\)\s*\.Any\(e => !e\.EndsWith\("Data\.zip", StringComparison\.OrdinalIgnoreCase\)\);'
          $checkReplacement = @'
string marker = Path.Combine(dataPath, ".data-ready-v1");
                if (File.Exists(marker))
                    return true;

                bool hasAssets = Directory.EnumerateFileSystemEntries(dataPath)
                    .Any(e => !e.EndsWith("Data.zip", StringComparison.OrdinalIgnoreCase));

                if (hasAssets)
                {
                    File.WriteAllText(marker, "migrated");
                    return true;
                }

                return false;
'@
          $loadText = [regex]::Replace($loadText, $checkPattern, $checkReplacement)
          Set-Content $loadPath $loadText -Encoding UTF8

          Write-Host "Android otimizado: Data persistente e login direto."

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          include-prerelease: true

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: |
            platform-tools
            platforms;android-36
            build-tools;35.0.0
            ndk;27.2.12479018
          accept-android-sdk-licenses: true

      - name: Install .NET Android workload
        shell: pwsh
        run: dotnet workload install android

      - name: Restore tools
        shell: pwsh
        working-directory: muclient
        run: dotnet tool restore

      - name: Restore Android project
        shell: pwsh
        working-directory: muclient
        run: dotnet restore MuAndroid/MuAndroid.csproj -p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT

      - name: Publish Android APK
        shell: pwsh
        working-directory: muclient
        run: |
          dotnet publish MuAndroid/MuAndroid.csproj `
            -c Release `
            -f net10.0-android `
            -p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT `
            -p:AcceptAndroidSdkLicenses=true `
            -p:AndroidPackageFormat=apk

      - name: Collect APK
        shell: pwsh
        working-directory: muclient
        run: |
          $apks = Get-ChildItem "MuAndroid/bin/Release" -Recurse -Filter "*.apk" |
            Sort-Object Length -Descending
          if (-not $apks) {
            throw "Nenhum APK foi gerado."
          }

          New-Item "../artifact" -ItemType Directory -Force | Out-Null
          Copy-Item $apks[0].FullName "../artifact/MU-Online-Mobile-OpenMU-v2.apk" -Force
          Get-Item "../artifact/MU-Online-Mobile-OpenMU-v2.apk" | Format-List FullName,Length

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MU-Online-Mobile-OpenMU-v2
          path: artifact/MU-Online-Mobile-OpenMU-v2.apk
          if-no-files-found: error
          retention-days: 30
